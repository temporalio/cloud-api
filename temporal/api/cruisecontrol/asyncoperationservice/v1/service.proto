syntax = "proto3";
package temporal.api.cruisecontrol.asyncoperationservice.v1;

import "temporal/api/cruisecontrol/asyncoperationservice/v1/request_response.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/temporalio/cruise-control/api-go/temporal/api/cruisecontrol/asyncoperationservice/v1;asyncoperationservicev1";

service AsyncOperationService {
  rpc GetAsyncOperation(GetAsyncOperationRequest) returns (GetAsyncOperationResponse) {
    option (google.api.http) = {
      get: "/v1/operations/{operation_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "AsyncOperationService"
      summary: "Get Async Operation"
      description: "Get Async Operation."
      operation_id: "AsyncOperationService_GetAsyncOperation"
    };
  }
}
