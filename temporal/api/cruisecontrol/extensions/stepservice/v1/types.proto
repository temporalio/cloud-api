syntax = "proto3";
package temporal.api.cruisecontrol.extensions.stepservice.v1;

option go_package = "github.com/temporalio/cruise-control/api-go/temporal/api/cruisecontrol/extensions/stepservice/v1;stepservicev1";

// StepExecutionDirection identifies whether a custom step applies or compensates
// its operation. Cruise Control currently invokes custom steps only in the
// forward direction.
enum StepExecutionDirection {
  // Invalid default; callers must select a direction.
  STEP_EXECUTION_DIRECTION_UNSPECIFIED = 0;
  // Executes the custom step's forward operation.
  STEP_EXECUTION_DIRECTION_FORWARD = 1;
  // Executes the custom step's compensating operation. Reserved for forward compatibility.
  STEP_EXECUTION_DIRECTION_ROLLBACK = 2;
}
