syntax = "proto3";
package temporal.api.cruisecontrol.extensions.stepservice.v1;

import "temporal/api/cruisecontrol/extensions/stepservice/v1/request_response.proto";

option go_package = "github.com/temporalio/cruise-control/api-go/temporal/api/cruisecontrol/extensions/stepservice/v1;stepservicev1";

// StepService executes provider-defined Custom Steps. Implementations must be
// idempotent because workflow activity retries may repeat an invocation.
service StepService {
  // Executes a Custom Step in a Promotion Run.
  rpc ExecutePromotionStep(ExecutePromotionStepRequest) returns (ExecutePromotionStepResponse);
  // Executes a Custom Step in a Deployment Run.
  rpc ExecuteDeploymentStep(ExecuteDeploymentStepRequest) returns (ExecuteDeploymentStepResponse);
}
